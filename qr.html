<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>باركود الطلب</title>
<style>
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;text-align:center;color:#1b2430;background:#fff}
.page{max-width:560px;margin:0 auto;padding:30px 20px}
h1{color:#741e24;font-size:30px;margin:0 0 6px}p{font-size:19px;margin:6px 0}
#qr{display:inline-block;padding:16px;border:3px solid #741e24;border-radius:20px;margin:22px 0}
#qr img,#qr canvas{display:block;width:300px;height:300px}
.url{direction:ltr;font-size:13px;color:#64707f;word-break:break-all}
button{margin-top:16px;padding:12px 26px;font:inherit;font-size:17px;border:0;border-radius:12px;background:#741e24;color:#fff;cursor:pointer}
@media print{button{display:none}}
</style></head><body><div class="page">
<h1>طلب رقم مركبة مميز</h1>
<p>امسح الباركود بكاميرا الجوال لتعبئة الطلب</p>
<p style="direction:ltr">Scan to fill the premium plate request</p>
<div id="qr"></div>
<div class="url" id="u"></div>
<button onclick="print()">طباعة</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var url=new URL('./',location.href).href;document.getElementById('u').textContent=url;
new QRCode(document.getElementById('qr'),{text:url,width:600,height:600,correctLevel:QRCode.CorrectLevel.M});
</script></body></html>
